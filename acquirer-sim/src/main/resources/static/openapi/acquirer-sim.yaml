openapi: 3.0.3
info:
  title: acquirer-sim
  version: 0.2.0
  description: >-
    A simulated card acquirer for running payment-gateway without a real one. Charges are kept in memory and decided
    by the card number:


    | Card number      | Result                                                                  |
    |------------------|-------------------------------------------------------------------------|
    | 4000000000000002 | declined, do_not_honor                                                  |
    | 4000000000009995 | declined, insufficient_funds                                            |
    | 4000000000000119 | declined, processing_error                                              |
    | 4000000000000259 | approved, but answered only after sim.slow-delay                        |
    | 4000000000003220 | requires_action: a 3-D Secure challenge at action_url decides           |
    | any other        | approved (4111111111111111, 5555555555554444, ...)                      |


    A past expiry month gives expired_card, CVC 000 gives incorrect_cvc.


    **3-D Secure.** A charge that requires_action waits for the cardholder at `action_url`, a page with two buttons
    instead of a real bank's check. Passing it approves the charge, failing it declines it with
    authentication_failed, and leaving it open past sim.challenge-ttl declines it with authentication_expired. Either
    way the browser then goes to the charge's `return_url`; the caller finds the outcome with a lookup.
servers:
  - url: /
    description: The server this page comes from
security:
  - Bearer: []

paths:
  /v1/charges:
    post:
      operationId: createCharge
      summary: Charge a card
      description: >-
        One charge per reference. The same request again returns the stored charge with 200; the same reference with
        a different amount, currency or card is refused with 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChargeRequest'
      responses:
        '201':
          description: Charged, declined, or waiting for the cardholder's challenge
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Charge'
        '200':
          description: The charge stored for this reference, as it is now
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Charge'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
    get:
      operationId: findCharge
      summary: Find the charge with a reference
      parameters:
        - name: reference
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The charge as it is now
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Charge'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'

  /challenge/{chargeId}:
    parameters:
      - name: chargeId
        in: path
        required: true
        schema:
          type: string
          pattern: '^ch_[0-9a-f]{24}$'
    get:
      operationId: showChallenge
      summary: The 3-D Secure challenge page, for the cardholder's browser
      security: []
      responses:
        '200':
          description: The challenge, or how it ended
          content:
            text/html:
              schema:
                type: string
        '404':
          description: No charge has this id
          content:
            text/html:
              schema:
                type: string
    post:
      operationId: completeChallenge
      summary: Pass or fail the challenge; the page's buttons post this
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [outcome]
              properties:
                outcome:
                  type: string
                  enum: [pass, fail]
      responses:
        '303':
          description: On to the charge's return_url
          headers:
            Location:
              schema:
                type: string
        '200':
          description: How the challenge ended, for a charge without a return_url
          content:
            text/html:
              schema:
                type: string
        '400':
          description: The outcome is neither pass nor fail
          content:
            text/html:
              schema:
                type: string
        '404':
          description: No charge has this id
          content:
            text/html:
              schema:
                type: string

components:
  securitySchemes:
    Bearer:
      type: http
      scheme: bearer

  responses:
    Error:
      description: Error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    ChargeRequest:
      type: object
      required: [reference, amount, currency, card]
      properties:
        reference:
          type: string
          maxLength: 64
          description: The caller's id for this charge
        amount:
          type: integer
          format: int64
          minimum: 1
          description: In minor units
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
          example: UAH
        card:
          type: object
          required: [number, exp_month, exp_year, cvc]
          properties:
            number:
              type: string
              pattern: '^[0-9]{12,19}$'
            exp_month:
              type: integer
              minimum: 1
              maximum: 12
            exp_year:
              type: integer
              minimum: 2000
              maximum: 2100
            cvc:
              type: string
              pattern: '^[0-9]{3,4}$'
            holder:
              type: string
              maxLength: 100
        description:
          type: string
          maxLength: 140
        return_url:
          type: string
          maxLength: 2048
          pattern: '^https?://\S+$'
          description: Where the cardholder's browser goes after a 3-D Secure challenge
          example: http://localhost:8090/3ds/return/0b8c2f6e-3f1d-4a52-9a77-2f4c1e0d9b31

    Charge:
      type: object
      required: [id, reference, status, amount, currency, created_at]
      properties:
        id:
          type: string
          example: ch_3f9a1c2b7d4e5f6a7b8c9d0e
        reference:
          type: string
        status:
          type: string
          enum: [approved, declined, requires_action]
        decline_code:
          type: string
          description: Only when declined
          example: insufficient_funds
        auth_code:
          type: string
          description: Only when approved
          example: '482913'
        action_url:
          type: string
          description: Only when requires_action, the challenge page for the cardholder's browser
          example: http://localhost:8091/challenge/ch_3f9a1c2b7d4e5f6a7b8c9d0e
        amount:
          type: integer
          format: int64
        currency:
          type: string
        created_at:
          type: string
          format: date-time

    Error:
      type: object
      required: [error, message]
      properties:
        error:
          type: string
          example: invalid_request
        message:
          type: string
