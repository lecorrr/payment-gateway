openapi: 3.0.3
info:
  title: acquirer-sim
  version: 0.6.0
  description: >-
    A simulated card acquirer for running payment-gateway without a real one. Charges are kept in memory and decided
    by the card number:


    | Card number      | Result                                                                  |
    |------------------|-------------------------------------------------------------------------|
    | 4000000000000002 | declined, do_not_honor                                                  |
    | 4000000000009995 | declined, insufficient_funds                                            |
    | 4000000000000119 | declined, processing_error                                              |
    | 4000000000000259 | approved, but answered only after sim.slow-delay; so are its refunds    |
    | 4000000000003220 | requires_action: a 3-D Secure challenge at action_url decides           |
    | 4000000000005126 | approved, but every refund of it fails with refund_declined             |
    | any other        | approved (4111111111111111, 5555555555554444, ...)                      |


    A past expiry month gives expired_card, CVC 000 gives incorrect_cvc.


    **3-D Secure.** A charge that requires_action waits for the cardholder at `action_url`, a page with two buttons
    instead of a real bank's check. Passing it approves the charge, failing it declines it with
    authentication_failed, and leaving it open past sim.challenge-ttl declines it with authentication_expired. Either
    way the browser then goes to the charge's `return_url`; the caller finds the outcome with a lookup.


    **Refunds.** An approved charge can be refunded in full or in parts, as long as its refunds that succeeded or
    are pending stay within its amount. A refund through `/v1/refunds` is decided at once.


    **monobank's API.** Under `/api/merchant`, acquirer-sim also answers the part of monobank's acquiring API that
    payment-gateway's monobank connector uses, so a second copy of it can stand in for monobank. Those requests need
    the API key in `X-Token`. The same cards decide; a charge's id is its invoice id, and a declined charge is a
    "failure" with the errCode monobank uses for it: 6 for do_not_honor, 59 insufficient_funds, 80 incorrect_cvc, 51
    expired_card, 1000 processing_error, 1054 authentication_failed. A challenge left open is "expired". When
    payment-direct gives a `webHookUrl`, the decided invoice is POSTed there, signed in `X-Sign` with the key from
    `/api/merchant/pubkey` (ECDSA, P-256, SHA-256), up to three times. A refund through `invoice/cancel` is
    "processing" for sim.refund-delay, then finished, shown in the invoice's `cancelList` by its `extRef`, and
    POSTed in the same way. Errors are in acquirer-sim's own format.
servers:
  - url: /
    description: The server this page comes from
security:
  - Bearer: []

paths:
  /v1/charges:
    post:
      operationId: createCharge
      summary: Charge a card
      description: >-
        One charge per reference. The same request again returns the stored charge with 200; the same reference with
        a different amount, currency or card is refused with 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChargeRequest'
      responses:
        '201':
          description: Charged, declined, or waiting for the cardholder's challenge
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Charge'
        '200':
          description: The charge stored for this reference, as it is now
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Charge'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
    get:
      operationId: findCharge
      summary: Find the charge with a reference
      parameters:
        - name: reference
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The charge as it is now
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Charge'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'

  /v1/refunds:
    post:
      operationId: createRefund
      summary: Refund all or part of a charge
      description: >-
        One refund per reference. The same request again returns the stored refund with 200; the same reference
        with another charge or amount is refused with 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefundRequest'
      responses:
        '201':
          description: Refunded, or declined
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Refund'
        '200':
          description: The refund stored for this reference, as it is now
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Refund'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
    get:
      operationId: findRefund
      summary: Find the refund with a reference
      parameters:
        - name: reference
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The refund as it is now
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Refund'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'

  /challenge/{chargeId}:
    parameters:
      - name: chargeId
        in: path
        required: true
        schema:
          type: string
          pattern: '^ch_[0-9a-f]{24}$'
    get:
      operationId: showChallenge
      summary: The 3-D Secure challenge page, for the cardholder's browser
      security: []
      responses:
        '200':
          description: The challenge, or how it ended
          content:
            text/html:
              schema:
                type: string
        '404':
          description: No charge has this id
          content:
            text/html:
              schema:
                type: string
    post:
      operationId: completeChallenge
      summary: Pass or fail the challenge; the page's buttons post this
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [outcome]
              properties:
                outcome:
                  type: string
                  enum: [pass, fail]
      responses:
        '303':
          description: On to the charge's return_url
          headers:
            Location:
              schema:
                type: string
        '200':
          description: How the challenge ended, for a charge without a return_url
          content:
            text/html:
              schema:
                type: string
        '400':
          description: The outcome is neither pass nor fail
          content:
            text/html:
              schema:
                type: string
        '404':
          description: No charge has this id
          content:
            text/html:
              schema:
                type: string

  /api/merchant/invoice/payment-direct:
    post:
      operationId: monobankPaymentDirect
      summary: Charge a card, as monobank's payment-direct
      description: >-
        One charge per reference, as with /v1/charges. A failure comes with failureReason but no errCode, as from
        monobank; the invoice status has the errCode. A challenge comes as "processing" with tdsUrl.
      security:
        - XToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MonobankPaymentDirect'
      responses:
        '200':
          description: The invoice
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MonobankInvoice'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'

  /api/merchant/invoice/status:
    get:
      operationId: monobankInvoiceStatus
      summary: The invoice as it is now
      security:
        - XToken: []
      parameters:
        - name: invoiceId
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The invoice
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MonobankInvoice'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'

  /api/merchant/invoice/cancel:
    post:
      operationId: monobankCancel
      summary: Refund all or part of a paid invoice, as monobank's cancel
      description: >-
        Answers "processing"; the refund is finished after sim.refund-delay, and the invoice's webhook is sent
        then. Without an amount, what is left of the invoice is refunded; without an extRef, the refund gets a
        reference of its own. The same extRef and amount again returns the stored refund.
      security:
        - XToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MonobankCancel'
      responses:
        '200':
          description: The refund's status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MonobankCancelAnswer'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'

  /api/merchant/statement:
    get:
      operationId: monobankStatement
      summary: The invoices made in a period, the newest first
      security:
        - XToken: []
      parameters:
        - name: from
          in: query
          required: true
          description: Unix time in seconds
          schema:
            type: integer
            format: int64
        - name: to
          in: query
          required: false
          description: Unix time in seconds; now if left out
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: The invoices
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MonobankStatement'
        '403':
          $ref: '#/components/responses/Error'

  /api/merchant/pubkey:
    get:
      operationId: monobankPublicKey
      summary: The key webhooks are signed with
      security:
        - XToken: []
      responses:
        '200':
          description: Base64 of a PEM block; a new key at every start
          content:
            application/json:
              schema:
                type: object
                required: [key]
                properties:
                  key:
                    type: string
        '403':
          $ref: '#/components/responses/Error'

components:
  securitySchemes:
    Bearer:
      type: http
      scheme: bearer
    XToken:
      type: apiKey
      in: header
      name: X-Token

  responses:
    Error:
      description: Error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    ChargeRequest:
      type: object
      required: [reference, amount, currency, card]
      properties:
        reference:
          type: string
          maxLength: 64
          description: The caller's id for this charge
        amount:
          type: integer
          format: int64
          minimum: 1
          description: In minor units
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
          example: UAH
        card:
          type: object
          required: [number, exp_month, exp_year, cvc]
          properties:
            number:
              type: string
              pattern: '^[0-9]{12,19}$'
            exp_month:
              type: integer
              minimum: 1
              maximum: 12
            exp_year:
              type: integer
              minimum: 2000
              maximum: 2100
            cvc:
              type: string
              pattern: '^[0-9]{3,4}$'
            holder:
              type: string
              maxLength: 100
        description:
          type: string
          maxLength: 140
        return_url:
          type: string
          maxLength: 2048
          pattern: '^https?://\S+$'
          description: Where the cardholder's browser goes after a 3-D Secure challenge
          example: http://localhost:8090/3ds/return/0b8c2f6e-3f1d-4a52-9a77-2f4c1e0d9b31

    Charge:
      type: object
      required: [id, reference, status, amount, currency, created_at]
      properties:
        id:
          type: string
          example: ch_3f9a1c2b7d4e5f6a7b8c9d0e
        reference:
          type: string
        status:
          type: string
          enum: [approved, declined, requires_action]
        decline_code:
          type: string
          description: Only when declined
          example: insufficient_funds
        auth_code:
          type: string
          description: Only when approved
          example: '482913'
        action_url:
          type: string
          description: Only when requires_action, the challenge page for the cardholder's browser
          example: http://localhost:8091/challenge/ch_3f9a1c2b7d4e5f6a7b8c9d0e
        amount:
          type: integer
          format: int64
        currency:
          type: string
        created_at:
          type: string
          format: date-time

    MonobankPaymentDirect:
      type: object
      required: [amount, ccy, cardData, merchantPaymInfo, redirectUrl]
      properties:
        amount:
          type: integer
          format: int64
          minimum: 1
          description: In minor units
        ccy:
          type: integer
          enum: [980, 840, 978]
          description: ISO 4217 number of UAH, USD or EUR
        cardData:
          type: object
          required: [pan, exp, cvv]
          properties:
            pan:
              type: string
              pattern: '^[0-9]{12,19}$'
            exp:
              type: string
              pattern: '^(0[1-9]|1[0-2])[0-9]{2}$'
              description: mmyy
            cvv:
              type: string
              pattern: '^[0-9]{3,4}$'
        merchantPaymInfo:
          type: object
          required: [reference]
          properties:
            reference:
              type: string
              maxLength: 64
            destination:
              type: string
              maxLength: 280
        redirectUrl:
          type: string
          description: Where the browser goes after a challenge
        webHookUrl:
          type: string
          description: Where the decided invoice is sent
        paymentType:
          type: string
          enum: [debit]
        initiationKind:
          type: string
          enum: [client, merchant]

    RefundRequest:
      type: object
      required: [charge_id, reference, amount]
      properties:
        charge_id:
          type: string
          maxLength: 64
        reference:
          type: string
          maxLength: 64
          description: The caller's id for the refund
        amount:
          type: integer
          format: int64
          minimum: 1

    Refund:
      type: object
      required: [id, charge_id, reference, amount, currency, status, created_at, updated_at]
      properties:
        id:
          type: string
          example: re_7d4e5f6a7b8c9d0e1f2a3b4c
        charge_id:
          type: string
        reference:
          type: string
        amount:
          type: integer
          format: int64
        currency:
          type: string
        status:
          type: string
          enum: [succeeded, failed, pending]
        failure_code:
          type: string
          description: With failed only
          example: refund_declined
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    MonobankCancel:
      type: object
      required: [invoiceId]
      properties:
        invoiceId:
          type: string
          maxLength: 64
        extRef:
          type: string
          maxLength: 64
          description: The merchant's reference for the refund
        amount:
          type: integer
          format: int64
          minimum: 1

    MonobankCancelAnswer:
      type: object
      required: [status, createdDate, modifiedDate]
      properties:
        status:
          type: string
          enum: [processing, success, failure]
        createdDate:
          type: string
          format: date-time
        modifiedDate:
          type: string
          format: date-time

    MonobankInvoice:
      type: object
      required: [invoiceId, status, amount, ccy, finalAmount, createdDate, reference]
      properties:
        invoiceId:
          type: string
        status:
          type: string
          enum: [success, failure, processing, expired, reversed]
        errCode:
          type: string
        failureReason:
          type: string
        amount:
          type: integer
          format: int64
        ccy:
          type: integer
        finalAmount:
          type: integer
          format: int64
        createdDate:
          type: string
          format: date-time
        reference:
          type: string
        tdsUrl:
          type: string
          description: From payment-direct only, for a challenge
        cancelList:
          type: array
          description: The invoice's refunds, in the order they were made; not in payment-direct's answer
          items:
            type: object
            properties:
              status:
                type: string
                enum: [processing, success, failure]
              amount:
                type: integer
                format: int64
              ccy:
                type: integer
              createdDate:
                type: string
                format: date-time
              modifiedDate:
                type: string
                format: date-time
              extRef:
                type: string

    MonobankStatement:
      type: object
      required: [list]
      properties:
        list:
          type: array
          items:
            type: object
            properties:
              invoiceId:
                type: string
              status:
                type: string
              amount:
                type: integer
                format: int64
              ccy:
                type: integer
              date:
                type: string
                format: date-time
              reference:
                type: string

    Error:
      type: object
      required: [error, message]
      properties:
        error:
          type: string
          example: invalid_request
        message:
          type: string
