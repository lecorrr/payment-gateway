spring:
  application:
    name: acquirer-sim

server:
  port: 8091

sim:
  api-key: ${ACQUIRER_SIM_API_KEY:}
  # How browsers reach acquirer-sim: the 3-D Secure challenge pages are linked with it.
  public-url: ${SIM_PUBLIC_URL:http://localhost:8091}
  slow-delay: 15s   # longer than the gateway's read timeout, so its answer is lost
  challenge-ttl: 15m
  max-charges: 10000
  # How long a refund sent the monobank way (invoice/cancel) stays "processing" before it is finished.
  refund-delay: 2s

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  # Prometheus scrapes the metrics; nothing here takes them over OTLP.
  otlp:
    metrics:
      export:
        enabled: false
  # Every request is traced; traces are sent where MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT points.
  tracing:
    sampling:
      probability: 1.0

springdoc:
  swagger-ui:
    url: /openapi/acquirer-sim.yaml
