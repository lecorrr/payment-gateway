spring:
  application:
    name: gateway-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:${GATEWAY_DB_PORT:5436}/gateway}
    username: ${DB_USER:gateway}
    password: ${DB_PASSWORD:gateway}
    hikari:
      connection-init-sql: SET lock_timeout TO '5s'   # a long lock wait fails the request instead of hanging
  flyway:
    locations: classpath:db/migration
  # Shares the providers' open circuits between gateway instances. Optional: without it each instance goes by its
  # own circuits, so a payment never waits on Redis for longer than these.
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      connect-timeout: 500ms
      timeout: 500ms
  # risk-service, asked about every new payment (gateway.risk).
  grpc:
    client:
      channel:
        risk:
          target: ${RISK_SERVICE_TARGET:static://localhost:9090}

server:
  port: 8090

gateway:
  # Set up at startup when the key is set; see the README for making one.
  demo-merchant:
    code: demo-shop
    name: Demo Shop
    api-key: ${GATEWAY_DEMO_MERCHANT_API_KEY:}
    # Both or neither: where its webhooks go, and their whsec_ signing secret.
    webhook-url: ${GATEWAY_DEMO_MERCHANT_WEBHOOK_URL:}
    webhook-secret: ${GATEWAY_DEMO_MERCHANT_WEBHOOK_SECRET:}
  payments:
    fingerprint-key: ${GATEWAY_FINGERPRINT_KEY:}
    # How customers' browsers reach the gateway: they come back here from 3-D Secure challenges.
    public-url: ${GATEWAY_PUBLIC_URL:http://localhost:8090}
    # Longer than a charge can take: every provider's connect timeout below plus the longest read timeout.
    first-check-after: 30s
    check-interval: 10s
    challenge-check-interval: 1m
    give-up-after: 10m
    check-batch-size: 20
  webhooks:
    dispatch-interval: 1s
    batch-size: 20
    connect-timeout: 2s
    read-timeout: 15s
    # Then given up: seven attempts over about 18 hours.
    retry-delays:
      - 5s
      - 5m
      - 30m
      - 2h
      - 5h
      - 10h
  risk:
    enabled: ${GATEWAY_RISK_ENABLED:true}
    deadline: 300ms
    # What a payment gets while risk-service can't answer: allow (it goes ahead unchecked) or decline (it fails).
    when-unavailable: ${GATEWAY_RISK_WHEN_UNAVAILABLE:allow}
    # After half of its last ten answers (at least five) were errors or late, risk-service isn't asked for this long.
    open-for: 30s
  providers:
    # Where new payments go, the preferred provider first: acquirer-sim, monobank, or both in either order. A payment
    # goes to the next provider only when one never got its charge. It is always looked up where it was charged.
    order: ${GATEWAY_PROVIDERS:acquirer-sim}
    # A provider is skipped for open-for once failure-rate-percent of its last window-size charges (at least
    # minimum-calls) got no answer or never got through; then trial-calls charges show whether it is back.
    circuit-breaker:
      window-size: 10
      minimum-calls: 5
      failure-rate-percent: 50
      open-for: 30s
      trial-calls: 2
    acquirer-sim:
      base-url: ${ACQUIRER_SIM_URL:http://localhost:8091}
      api-key: ${ACQUIRER_SIM_API_KEY:}
      connect-timeout: 2s
      read-timeout: 5s
    monobank:
      base-url: ${MONOBANK_URL:https://api.monobank.ua}
      token: ${GATEWAY_MONOBANK_TOKEN:}
      # This gateway's /providers/monobank/webhooks as monobank can reach it; empty for no webhooks.
      webhook-url: ${GATEWAY_MONOBANK_WEBHOOK_URL:}
      connect-timeout: 2s
      read-timeout: 10s

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  health:
    redis:
      enabled: false   # Redis is optional (see spring.data.redis), so it doesn't make the gateway unhealthy
  endpoint:
    health:
      probes:
        enabled: true
  # Metrics are scraped by Prometheus from /actuator/prometheus; the OpenTelemetry starter would also push them over
  # OTLP, which nothing here receives.
  otlp:
    metrics:
      export:
        enabled: false
  metrics:
    distribution:
      # Buckets for the latency panels: the API's requests, the calls to providers and to risk-service.
      percentiles-histogram:
        http.server.requests: true
        http.client.requests: true
        grpc.client: true
  # Every request is traced; traces are sent only where MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT
  # points (compose: Jaeger). Without it they stay in this process, and only their ids show in the log.
  tracing:
    sampling:
      probability: 1.0

springdoc:
  swagger-ui:
    url: /openapi/payment-gateway.yaml   # the hand-written contract, not one generated from the code

logging:
  level:
    dev.tkachuk.gateway: INFO
    # At DEBUG and TRACE this package logs request bodies, card numbers included: keep it at INFO.
    org.springframework.web.servlet.mvc.method.annotation: INFO
