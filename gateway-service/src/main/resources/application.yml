spring:
  application:
    name: gateway-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:${GATEWAY_DB_PORT:5436}/gateway}
    username: ${DB_USER:gateway}
    password: ${DB_PASSWORD:gateway}
    hikari:
      connection-init-sql: SET lock_timeout TO '5s'   # a long lock wait fails the request instead of hanging
  flyway:
    locations: classpath:db/migration

server:
  port: 8090

gateway:
  # Set up at startup when the key is set; see the README for making one.
  demo-merchant:
    code: demo-shop
    name: Demo Shop
    api-key: ${GATEWAY_DEMO_MERCHANT_API_KEY:}
  payments:
    fingerprint-key: ${GATEWAY_FINGERPRINT_KEY:}
    first-check-after: 30s   # longer than any provider's read timeout below
    check-interval: 10s
    give-up-after: 10m
    check-batch-size: 20
  providers:
    acquirer-sim:
      base-url: ${ACQUIRER_SIM_URL:http://localhost:8091}
      api-key: ${ACQUIRER_SIM_API_KEY:}
      connect-timeout: 2s
      read-timeout: 5s

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    url: /openapi/payment-gateway.yaml   # the hand-written contract, not one generated from the code

logging:
  level:
    dev.tkachuk.gateway: INFO
    # At DEBUG and TRACE this package logs request bodies, card numbers included: keep it at INFO.
    org.springframework.web.servlet.mvc.method.annotation: INFO
