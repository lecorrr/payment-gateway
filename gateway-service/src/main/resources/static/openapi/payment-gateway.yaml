openapi: 3.0.3
info:
  title: payment-gateway merchant API
  version: 0.3.0
  description: >-
    Card payments for merchants. A merchant sends the card once; the gateway passes it to a payment provider,
    keeps only the brand, the first six and the last four digits, and answers with the payment's status.


    Every call needs the merchant's API key in the `X-Api-Key` header. Amounts are integers in minor units
    (kopiyky, cents): 15000 with UAH is 150.00 UAH.


    **3-D Secure.** When the card's bank wants the customer to confirm the payment, it is `REQUIRES_ACTION` with a
    `nextAction`: send the customer's browser to `nextAction.url`. After the challenge the browser comes back to
    the gateway, which finishes the payment and sends the browser on to the request's `returnUrl`, with
    `?paymentId=...` added.


    **Webhooks.** A merchant with a webhook endpoint gets a POST for every status a payment reaches after
    PROCESSING, with a `PaymentEvent` as the body. Each one is signed by the Standard Webhooks scheme: the headers
    `webhook-id` (the same for every retry of one event), `webhook-timestamp` (Unix seconds) and
    `webhook-signature` (`v1,` and the Base64 HMAC-SHA256 of `{webhook-id}.{webhook-timestamp}.{body}`, keyed with
    the endpoint's `whsec_` secret, Base64-decoded). Any 2xx answer counts as delivered; anything else is retried
    with growing delays for most of a day. Delivery is at least once and in no guaranteed order: deduplicate by
    `webhook-id`, and trust the payment's `status` and `updatedAt` over the order of arrival.
servers:
  - url: /
    description: The server this page comes from
tags:
  - name: Payments
    description: >-
      Create a card payment and read its status. Creating needs an Idempotency-Key, so a retry after a timeout
      never charges the card twice.

security:
  - ApiKey: []

paths:
  /api/v1/payments:
    post:
      tags: [Payments]
      operationId: createPayment
      summary: Pay with a card
      description: >-
        The answer has one of five statuses. SUCCEEDED: the provider charged the card. DECLINED: the provider
        refused it; `declineCode` says why. FAILED: the provider never got the request, so nothing was charged.
        REQUIRES_ACTION: the customer has to pass the bank's 3-D Secure challenge at `nextAction.url` first.
        PROCESSING: the provider did not answer in time; the gateway asks it again in the background, so poll
        `GET /api/v1/payments/{paymentId}` until the status changes, or wait for the webhook.


        Repeating a request with the same Idempotency-Key returns the same payment (200, with
        `Idempotent-Replayed: true`) instead of charging again. The same key with a different body is refused
        with a 422 (IDEMPOTENCY_KEY_REUSED): it can never succeed, so do not retry it.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePaymentRequest'
      responses:
        '201':
          description: The payment was created; its status says how it ended
          headers:
            Location:
              description: Where to read the payment again
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse'
        '200':
          description: Replay of an earlier request with the same Idempotency-Key
          headers:
            Idempotent-Replayed:
              description: Always "true" on a replay
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'

  /api/v1/payments/{paymentId}:
    get:
      tags: [Payments]
      operationId: getPayment
      summary: Read a payment
      description: A merchant sees only its own payments; any other id is 404.
      parameters:
        - $ref: '#/components/parameters/PaymentId'
      responses:
        '200':
          description: The payment as it is now
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'

components:
  securitySchemes:
    ApiKey:
      type: apiKey
      in: header
      name: X-Api-Key

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Unique per payment attempt. Generate one per customer action and reuse it for retries.
      schema:
        type: string
        minLength: 1
        maxLength: 100
        example: 5c2f6a1e-8b3d-4c7a-9e0f-2a1b3c4d5e6f
    PaymentId:
      name: paymentId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    Problem:
      description: Error described as RFC 9457 problem details
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  schemas:
    Currency:
      type: string
      enum: [UAH, USD, EUR]

    PaymentStatus:
      type: string
      enum: [PROCESSING, REQUIRES_ACTION, SUCCEEDED, DECLINED, FAILED]

    CardBrand:
      type: string
      enum: [VISA, MASTERCARD, OTHER]

    CreatePaymentRequest:
      type: object
      required: [orderId, amount, currency, card]
      properties:
        orderId:
          type: string
          pattern: '^[A-Za-z0-9._-]{1,64}$'
          description: The merchant's own order number
          example: ORDER-1001
        amount:
          type: integer
          format: int64
          minimum: 1
          maximum: 100000000000
          description: In minor units of the currency
          example: 15000
        currency:
          $ref: '#/components/schemas/Currency'
        description:
          type: string
          maxLength: 140
          example: Two tickets
        returnUrl:
          type: string
          maxLength: 2048
          pattern: '^https?://\S+$'
          description: >-
            Where the customer's browser goes after a 3-D Secure challenge, with `?paymentId=...` added. Without
            one, the browser ends on a short page of the gateway's that shows the status.
          example: https://shop.example.com/checkout/done
        card:
          $ref: '#/components/schemas/CardDetails'

    CardDetails:
      type: object
      required: [number, expiryMonth, expiryYear, cvc]
      properties:
        number:
          type: string
          pattern: '^[0-9 ]{12,23}$'
          description: 12 to 19 digits; spaces are ignored
          example: '4111 1111 1111 1111'
        expiryMonth:
          type: integer
          minimum: 1
          maximum: 12
          example: 12
        expiryYear:
          type: integer
          minimum: 2000
          maximum: 2100
          example: 2030
        cvc:
          type: string
          pattern: '^[0-9]{3,4}$'
          description: Sent to the provider and never stored
          example: '123'
        holder:
          type: string
          maxLength: 100
          example: OLENA KOVALENKO

    CardSummary:
      type: object
      required: [brand, bin, last4]
      properties:
        brand:
          $ref: '#/components/schemas/CardBrand'
        bin:
          type: string
          description: The first six digits
          example: '411111'
        last4:
          type: string
          example: '1111'

    NextAction:
      type: object
      required: [type, url]
      description: What the customer has to do before the payment can finish; present only while REQUIRES_ACTION
      properties:
        type:
          type: string
          enum: [REDIRECT]
          description: REDIRECT, the only kind so far, means sending the customer's browser to the url
        url:
          type: string
          description: The 3-D Secure challenge of the customer's bank
          example: http://localhost:8091/challenge/ch_3f9a1c2b7d4e5f6a7b8c9d0e

    PaymentResponse:
      type: object
      required: [id, orderId, amount, currency, status, card, provider, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        orderId:
          type: string
          example: ORDER-1001
        amount:
          type: integer
          format: int64
          example: 15000
        currency:
          $ref: '#/components/schemas/Currency'
        description:
          type: string
        status:
          $ref: '#/components/schemas/PaymentStatus'
        nextAction:
          $ref: '#/components/schemas/NextAction'
        card:
          $ref: '#/components/schemas/CardSummary'
        provider:
          type: string
          description: The payment provider that handled the card
          example: acquirer-sim
        providerReference:
          type: string
          description: The provider's own id for the charge, once it has one
          example: ch_3f9a1c2b7d4e
        declineCode:
          type: string
          description: >-
            Why a DECLINED or FAILED payment did not go through. A decline has the same codes whichever provider
            charged the card (do_not_honor, insufficient_funds, expired_card, incorrect_cvc, processing_error,
            authentication_failed, authentication_expired); a failure has the gateway's own (provider_unavailable,
            provider_rejected_request, provider_no_record)
          example: insufficient_funds
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    PaymentEventType:
      type: string
      enum: [payment.requires_action, payment.succeeded, payment.declined, payment.failed]

    PaymentEvent:
      type: object
      required: [type, timestamp, data]
      description: >-
        The body of a webhook: the payment as `GET /api/v1/payments/{paymentId}` showed it right after the change.
        The type follows the status: REQUIRES_ACTION is payment.requires_action, SUCCEEDED payment.succeeded, and
        so on.
      properties:
        type:
          $ref: '#/components/schemas/PaymentEventType'
        timestamp:
          type: string
          format: date-time
          description: When the payment changed, not when the webhook was sent
        data:
          $ref: '#/components/schemas/PaymentResponse'

    Problem:
      type: object
      properties:
        type:
          type: string
          example: urn:payment-gateway:error:validation-failed
        title:
          type: string
          example: Validation failed
        status:
          type: integer
          example: 400
        detail:
          type: string
        code:
          type: string
          description: >-
            VALIDATION_FAILED, CARD_INVALID, CARD_EXPIRED, RETURN_URL_INVALID, UNAUTHORIZED, PAYMENT_NOT_FOUND,
            IDEMPOTENCY_KEY_REUSED or INTERNAL_ERROR
          example: VALIDATION_FAILED
        violations:
          type: array
          items:
            type: string
