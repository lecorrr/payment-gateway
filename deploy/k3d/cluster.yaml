# The local cluster of the dev and staging environments: k3s in Docker, one server and two agents, so staging's
# replicas spread over nodes and a node can be drained. Traefik, which comes with k3s, takes http://*.localhost:8280
# through k3d's load balancer; the API server listens on a free port of 127.0.0.1. create-cluster.sh makes it.
apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: payment-gateway
servers: 1
agents: 2
# Kubernetes 1.35; kubectl should be 1.34 to 1.36.
image: rancher/k3s:v1.35.10-k3s1
kubeAPI:
  hostIP: 127.0.0.1
ports:
  # Also in ingress.port of values-dev.yaml and values-staging.yaml.
  - port: 127.0.0.1:8280:80
    nodeFilters:
      - loadbalancer
options:
  k3s:
    extraArgs:
      # A laptop's disk is often fuller than the kubelet's defaults allow: at 85 % it removes unused images, at 90 %
      # it evicts pods. The images deploy.sh imports exist nowhere else, so removing one breaks the next rollout.
      # Pods are evicted only below 1 GiB free, and images go only at 99 %.
      - arg: --kubelet-arg=eviction-hard=memory.available<100Mi,nodefs.available<1Gi,imagefs.available<1Gi
        nodeFilters:
          - server:*
          - agent:*
      - arg: --kubelet-arg=image-gc-high-threshold=99
        nodeFilters:
          - server:*
          - agent:*
      - arg: --kubelet-arg=image-gc-low-threshold=98
        nodeFilters:
          - server:*
          - agent:*
  # The context k3d-payment-gateway goes into the kubeconfig, but kubectl's current context stays what it was: the
  # scripts and the README name this one.
  kubeconfig:
    updateDefaultKubeconfig: true
    switchCurrentContext: false
