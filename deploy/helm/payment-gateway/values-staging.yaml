# staging, on the same k3d cluster in its own namespace, payment-gateway-staging, run the way production is: at least
# two gateways, two risk-services and two ledgers spread over the nodes, the first two scaled by their CPU, with
# disruption budgets. The providers and the shop are still the simulators, and PostgreSQL, Redis and Kafka are in the
# namespace. Browsers reach it at http://*.staging.localhost:8280.
ingress:
  port: "8280"
  hosts:
    gateway: gateway.staging.localhost
    acquirerSim: acquirer.staging.localhost
    monobankSim: monobank.staging.localhost
    merchantSim: shop.staging.localhost

gateway:
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 4
  podDisruptionBudget:
    enabled: true

riskService:
  replicas: 2
  # Short, so the gateways soon spread their calls over a risk-service pod that came up after them.
  maxConnectionAge: 30s
  podDisruptionBudget:
    enabled: true

# Two ledgers share the topic's three partitions, and one takes them all while the other is away.
ledger:
  replicas: 2
  podDisruptionBudget:
    enabled: true

postgres:
  storage: 2Gi
