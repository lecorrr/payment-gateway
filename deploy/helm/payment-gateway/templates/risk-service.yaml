apiVersion: apps/v1
kind: Deployment
metadata:
  name: risk-service
  labels:
    {{- include "payment-gateway.labels" (dict "root" $ "name" "risk-service") | nindent 4 }}
spec:
  {{- if not .Values.riskService.autoscaling.enabled }}
  replicas: {{ .Values.riskService.replicas }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "payment-gateway.selectorLabels" (dict "root" $ "name" "risk-service") | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        {{- include "payment-gateway.labels" (dict "root" $ "name" "risk-service") | nindent 8 }}
    spec:
      {{- include "payment-gateway.podDefaults" . | nindent 6 }}
      securityContext:
        {{- include "payment-gateway.podSecurityContext" (dict "uid" 10001 "gid" 10001) | nindent 8 }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "payment-gateway.selectorLabels" (dict "root" $ "name" "risk-service") | nindent 14 }}
      terminationGracePeriodSeconds: 45
      containers:
        - name: risk-service
          image: {{ include "payment-gateway.image" (dict "root" $ "name" "risk-service") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: grpc
              containerPort: 9090
            # risk-service's HTTP port has nothing but the actuator, so it is the management port as it is.
            - name: management
              containerPort: 8094
          env:
            {{- include "payment-gateway.probeGroupsEnv" . | nindent 12 }}
            {{- with .Values.tracing.otlpEndpoint }}
            - name: MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT
              value: {{ . | quote }}
            {{- end }}
            {{- include "payment-gateway.redisEnv" . | nindent 12 }}
            - name: SPRING_GRPC_SERVER_KEEPALIVE_CONNECTION_MAXAGE
              value: {{ .Values.riskService.maxConnectionAge | quote }}
            {{- range $name, $value := .Values.riskService.env }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
          {{- include "payment-gateway.springProbes" . | nindent 10 }}
          {{- include "payment-gateway.springShutdown" . | nindent 10 }}
          resources:
            {{- toYaml .Values.riskService.resources | nindent 12 }}
          securityContext:
            {{- include "payment-gateway.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
# Headless: its name resolves to every ready pod's address rather than one virtual IP, so each gateway balances its
# gRPC calls over the pods itself. Through a virtual IP, a gateway's one long-lived HTTP/2 connection would take
# all its calls to a single pod.
apiVersion: v1
kind: Service
metadata:
  name: risk-service
  labels:
    {{- include "payment-gateway.labels" (dict "root" $ "name" "risk-service") | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- include "payment-gateway.selectorLabels" (dict "root" $ "name" "risk-service") | nindent 4 }}
  ports:
    - name: grpc
      port: 9090
      targetPort: grpc
    - name: management
      port: 8094
      targetPort: management
