{{- with .Values.externalSecret }}
{{- if .enabled }}
# The Secret the apps read (existingSecret), which External Secrets writes from the secret store and keeps current:
# the databases' passwords from their own secrets, every other key from the app's secret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $.Values.existingSecret }}
  labels:
    {{- include "payment-gateway.labels" (dict "root" $ "name" "payment-gateway") | nindent 4 }}
spec:
  refreshInterval: {{ .refreshInterval }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ required "externalSecret.storeName is needed when externalSecret.enabled is true" .storeName }}
  target:
    name: {{ $.Values.existingSecret }}
    creationPolicy: Owner
  data:
    - secretKey: DB_PASSWORD
      remoteRef:
        key: {{ required "externalSecret.databaseSecret is needed when externalSecret.enabled is true" .databaseSecret }}
        property: password
    {{- if $.Values.ledger.enabled }}
    - secretKey: LEDGER_DB_PASSWORD
      remoteRef:
        key: {{ required "externalSecret.ledgerDatabaseSecret is needed when externalSecret.enabled and ledger.enabled are true" .ledgerDatabaseSecret }}
        property: password
    {{- end }}
  dataFrom:
    - extract:
        key: {{ required "externalSecret.appSecret is needed when externalSecret.enabled is true" .appSecret }}
{{- end }}
{{- end }}
