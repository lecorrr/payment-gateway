{{- if .Values.postgres.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels:
    {{- include "payment-gateway.labels" (dict "root" $ "name" "postgres") | nindent 4 }}
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      {{- include "payment-gateway.selectorLabels" (dict "root" $ "name" "postgres") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "payment-gateway.labels" (dict "root" $ "name" "postgres") | nindent 8 }}
    spec:
      {{- include "payment-gateway.podDefaults" . | nindent 6 }}
      # 70 is the postgres user of the alpine image.
      securityContext:
        {{- include "payment-gateway.podSecurityContext" (dict "uid" 70 "gid" 70) | nindent 8 }}
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: POSTGRES_DB
              value: gateway
            - name: POSTGRES_USER
              value: {{ .Values.database.username | quote }}
            {{- include "payment-gateway.secretEnv" (dict "root" $ "name" "POSTGRES_PASSWORD" "key" "DB_PASSWORD") | nindent 12 }}
            # A folder inside the volume rather than the volume itself, whose top the postgres user may not own.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgres
              containerPort: 5432
          startupProbe:
            exec:
              command: ["pg_isready", "-h", "127.0.0.1", "-U", {{ .Values.database.username | quote }}, "-d", "gateway"]
            periodSeconds: 2
            failureThreshold: 60
          livenessProbe:
            exec:
              command: ["pg_isready", "-h", "127.0.0.1", "-U", {{ .Values.database.username | quote }}, "-d", "gateway"]
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            exec:
              command: ["pg_isready", "-h", "127.0.0.1", "-U", {{ .Values.database.username | quote }}, "-d", "gateway"]
            periodSeconds: 5
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
          securityContext:
            {{- include "payment-gateway.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            # The socket's folder and /tmp, as the root file system is read-only.
            - name: run
              mountPath: /run/postgresql
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- include "payment-gateway.selectorLabels" (dict "root" $ "name" "postgres") | nindent 10 }}
      spec:
        accessModes:
          - ReadWriteOnce
        {{- with .Values.postgres.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.postgres.storage }}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    {{- include "payment-gateway.labels" (dict "root" $ "name" "postgres") | nindent 4 }}
spec:
  selector:
    {{- include "payment-gateway.selectorLabels" (dict "root" $ "name" "postgres") | nindent 4 }}
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
{{- end }}
