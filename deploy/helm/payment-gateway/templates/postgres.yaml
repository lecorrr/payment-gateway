{{- /* The gateway's database, and the ledger's: one server each, as each service owns its data. */ -}}
{{- if .Values.postgres.enabled }}
{{ include "payment-gateway.postgres" (dict "root" $ "name" "postgres" "database" "gateway" "username" .Values.database.username "passwordKey" "DB_PASSWORD" "values" .Values.postgres) }}
{{- end }}
{{- if and .Values.ledger.enabled .Values.ledger.postgres.enabled }}
---
{{ include "payment-gateway.postgres" (dict "root" $ "name" "ledger-postgres" "database" "ledger" "username" .Values.ledger.database.username "passwordKey" "LEDGER_DB_PASSWORD" "values" .Values.ledger.postgres) }}
{{- end }}
