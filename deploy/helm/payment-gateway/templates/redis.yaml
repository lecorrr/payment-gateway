{{- if .Values.redis.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  labels:
    {{- include "payment-gateway.labels" (dict "root" $ "name" "redis") | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "payment-gateway.selectorLabels" (dict "root" $ "name" "redis") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "payment-gateway.labels" (dict "root" $ "name" "redis") | nindent 8 }}
    spec:
      {{- include "payment-gateway.podDefaults" . | nindent 6 }}
      # 999 and 1000 are the redis user and group of the alpine image.
      securityContext:
        {{- include "payment-gateway.podSecurityContext" (dict "uid" 999 "gid" 1000) | nindent 8 }}
      containers:
        - name: redis
          image: {{ .Values.redis.image }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # Open circuits and recent payment counts are worth nothing after a restart, so nothing goes to disk.
          args: ["--save", "", "--appendonly", "no"]
          ports:
            - name: redis
              containerPort: 6379
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 5
            timeoutSeconds: 3
          resources:
            {{- toYaml .Values.redis.resources | nindent 12 }}
          securityContext:
            {{- include "payment-gateway.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  labels:
    {{- include "payment-gateway.labels" (dict "root" $ "name" "redis") | nindent 4 }}
spec:
  selector:
    {{- include "payment-gateway.selectorLabels" (dict "root" $ "name" "redis") | nindent 4 }}
  ports:
    - name: redis
      port: 6379
      targetPort: redis
{{- end }}
