{{- if .Values.kafka.enabled }}
{{- if ne (int .Values.kafka.replicationFactor) 1 }}
{{- fail "kafka.replicationFactor must be 1 with kafka.enabled: the namespace's Kafka is a single broker" }}
{{- end }}
{{- if ne .Values.kafka.securityProtocol "PLAINTEXT" }}
{{- fail "kafka.securityProtocol must be PLAINTEXT with kafka.enabled: the namespace's Kafka has no TLS" }}
{{- end }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  labels:
    {{- include "payment-gateway.labels" (dict "root" $ "name" "kafka") | nindent 4 }}
spec:
  serviceName: kafka
  replicas: 1
  selector:
    matchLabels:
      {{- include "payment-gateway.selectorLabels" (dict "root" $ "name" "kafka") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "payment-gateway.labels" (dict "root" $ "name" "kafka") | nindent 8 }}
    spec:
      {{- include "payment-gateway.podDefaults" . | nindent 6 }}
      # 1000 is the appuser of the apache/kafka image.
      securityContext:
        {{- include "payment-gateway.podSecurityContext" (dict "uid" 1000 "gid" 1000) | nindent 8 }}
      # Time to close the logs cleanly, so the next start doesn't have to recover them.
      terminationGracePeriodSeconds: 60
      containers:
        - name: kafka
          image: {{ .Values.kafka.image }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # One node that is both the broker and the controller (KRaft, no ZooKeeper). The image writes
          # server.properties from the KAFKA_ variables, and leaves out its own defaults once one is set, so they
          # are all here, as in compose.yaml.
          env:
            # Fixed, so a restart finds its own data in the volume.
            - name: CLUSTER_ID
              value: {{ .Values.kafka.clusterId | quote }}
            - name: KAFKA_NODE_ID
              value: "1"
            - name: KAFKA_PROCESS_ROLES
              value: broker,controller
            - name: KAFKA_LISTENERS
              value: PLAINTEXT://:9092,CONTROLLER://:9093
            - name: KAFKA_ADVERTISED_LISTENERS
              value: PLAINTEXT://kafka:9092
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: PLAINTEXT
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: CONTROLLER
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: 1@localhost:9093
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"
            - name: KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR
              value: "1"
            - name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS
              value: "0"
            # Topics are made by the apps that own them, with their partitions: a misspelt name is an error.
            - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
              value: "false"
            # A folder inside the volume rather than the volume itself, whose top may hold lost+found.
            - name: KAFKA_LOG_DIRS
              value: /var/lib/kafka/data/kafka-logs
            - name: KAFKA_HEAP_OPTS
              value: {{ printf "-Xms%s -Xmx%s" .Values.kafka.heap .Values.kafka.heap | quote }}
            # The broker's own log files, as the root file system is read-only; they also go to the console.
            - name: LOG_DIR
              value: /tmp/kafka-logs
          ports:
            - name: kafka
              containerPort: 9092
          # The listener's port: Kafka has no HTTP health endpoint, and its own tools each start a JVM.
          startupProbe:
            tcpSocket:
              port: kafka
            periodSeconds: 2
            failureThreshold: 60
          livenessProbe:
            tcpSocket:
              port: kafka
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          readinessProbe:
            tcpSocket:
              port: kafka
            periodSeconds: 5
            timeoutSeconds: 3
          resources:
            {{- toYaml .Values.kafka.resources | nindent 12 }}
          securityContext:
            {{- include "payment-gateway.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/kafka/data
            # Where the image writes the broker's configuration at each start.
            - name: config
              mountPath: /opt/kafka/config
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          emptyDir: {}
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- include "payment-gateway.selectorLabels" (dict "root" $ "name" "kafka") | nindent 10 }}
      spec:
        accessModes:
          - ReadWriteOnce
        {{- with .Values.kafka.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.kafka.storage }}
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  labels:
    {{- include "payment-gateway.labels" (dict "root" $ "name" "kafka") | nindent 4 }}
spec:
  selector:
    {{- include "payment-gateway.selectorLabels" (dict "root" $ "name" "kafka") | nindent 4 }}
  ports:
    # The address the broker gives clients, kafka:9092, is this Service's.
    - name: kafka
      port: 9092
      targetPort: kafka
{{- end }}
