# External Secrets' store for prod: AWS Secrets Manager in prod's region. Applied once to the cluster, after External
# Secrets is installed. Its controller gets the IAM role of deploy/aws/modules/secrets through EKS Pod Identity, which
# the AWS SDK finds by itself, so there is no auth here. ci/check-chart.sh checks it against the CRD's schema.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: eu-central-1
  # The controller's role reads every secret of prod, so only prod's namespace may read through this store.
  conditions:
    - namespaces:
        - payment-gateway-prod
