# Runs on GitLab's small Linux runners (docs/gitlab-setup.md), which allow the privileged containers that
# Docker-in-Docker needs. Each job gets its own Docker daemon, for Testcontainers and docker build.

stages:
  - test
  - package

default:
  # Only GitLab's runners have this tag. A runner on your own machine would show that machine's internet address in
  # the details of every job it runs, and this project's jobs are public.
  tags:
    - saas-linux-small-amd64

variables:
  # Maven and the Maven wrapper download into the project folder, so GitLab's cache can keep both.
  MAVEN_USER_HOME: "$CI_PROJECT_DIR/.m2"
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
  MAVEN_CLI_OPTS: "--batch-mode --no-transfer-progress"
  # A network hiccup while the runner fetches the repository or restores the cache is tried again, instead of
  # failing the job before it starts.
  GET_SOURCES_ATTEMPTS: "3"
  RESTORE_CACHE_ATTEMPTS: "3"
  ARTIFACT_DOWNLOAD_ATTEMPTS: "3"
  # Docker-in-Docker without TLS; Testcontainers finds the daemon through DOCKER_HOST.
  DOCKER_HOST: "tcp://docker:2375"
  DOCKER_TLS_CERTDIR: ""
  DOCKER_DRIVER: overlay2

.docker-in-docker:
  services:
    - name: docker:29-dind
      alias: docker
      # Docker Hub limits anonymous pulls per IP address, and GitLab's runners share theirs with other projects.
      # Google's copy of Docker Hub serves postgres, redis and the Java base image instead; Docker Hub itself still
      # serves anything the copy lacks.
      command: ["--tls=false", "--registry-mirror=https://mirror.gcr.io"]

# Unit tests, integration tests against PostgreSQL and Redis in Testcontainers, and the coverage gate (80 % of lines
# per module): any of them failing fails the pipeline.
verify:
  stage: test
  extends: .docker-in-docker
  image: eclipse-temurin:21-jdk
  variables:
    # Ryuk removes test containers when a run dies; this job's Docker daemon is thrown away anyway, so skip
    # pulling it.
    TESTCONTAINERS_RYUK_DISABLED: "true"
  cache:
    key: maven
    paths:
      - .m2/
  script:
    - ./mvnw $MAVEN_CLI_OPTS verify
    - bash ci/print-coverage.sh gateway-service risk-service acquirer-sim merchant-sim
  # The gateway's line coverage, shown on the pipeline and merge request pages.
  coverage: '/gateway-service line coverage: \d+\.\d+%/'
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - gateway-service/target/gateway-service.jar
      - risk-service/target/risk-service.jar
      - acquirer-sim/target/acquirer-sim.jar
      - merchant-sim/target/merchant-sim.jar
      - "*/target/site/jacoco/"
    reports:
      junit:
        - "*/target/surefire-reports/TEST-*.xml"
        - "*/target/failsafe-reports/TEST-*.xml"
      coverage_report:
        coverage_format: jacoco
        path: "*/target/site/jacoco/jacoco.xml"

# The Helm chart, linted and rendered for each environment, and what it renders checked against Kubernetes' schemas
# (ci/check-chart.sh). It needs neither the build nor Docker, so it runs beside verify.
chart:
  stage: test
  image: alpine:3.22
  needs: []
  variables:
    HELM_VERSION: "4.3.2"
    KUBECONFORM_VERSION: "0.8.0"
    # From kubeconform's CHECKSUMS of the release.
    KUBECONFORM_SHA256: "9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883"
  before_script:
    - apk add --no-cache bash curl
    # Helm from its own site, checked against the checksum it publishes beside the download.
    - curl -fsSLO "https://get.helm.sh/helm-v${HELM_VERSION}-linux-amd64.tar.gz"
    - curl -fsSL "https://get.helm.sh/helm-v${HELM_VERSION}-linux-amd64.tar.gz.sha256sum" -o helm.sha256sum
    - echo "$(cut -d ' ' -f 1 helm.sha256sum)  helm-v${HELM_VERSION}-linux-amd64.tar.gz" | sha256sum -c -
    - tar -xzf "helm-v${HELM_VERSION}-linux-amd64.tar.gz"
    - install linux-amd64/helm /usr/local/bin/helm
    - curl -fsSLO "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
    - echo "${KUBECONFORM_SHA256}  kubeconform-linux-amd64.tar.gz" | sha256sum -c -
    - tar -xzf kubeconform-linux-amd64.tar.gz kubeconform
    - install kubeconform /usr/local/bin/kubeconform
  script:
    - bash ci/check-chart.sh

# The images from the jars verify built; not pushed anywhere yet.
images:
  stage: package
  extends: .docker-in-docker
  image: docker:29-cli
  needs:
    - job: verify
      artifacts: true
  script:
    - docker build --tag "gateway-service:$CI_COMMIT_SHORT_SHA" gateway-service
    - docker build --tag "risk-service:$CI_COMMIT_SHORT_SHA" risk-service
    - docker build --tag "acquirer-sim:$CI_COMMIT_SHORT_SHA" acquirer-sim
    - docker build --tag "merchant-sim:$CI_COMMIT_SHORT_SHA" merchant-sim
