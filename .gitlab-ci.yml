# Runs on the project runner set up in docs/gitlab-setup.md. Each job gets its own Docker-in-Docker daemon, for
# Testcontainers and docker build; that needs a runner with privileged = true.

stages:
  - test
  - package

variables:
  # Maven and the Maven wrapper download into the project folder, so the runner cache can keep both.
  MAVEN_USER_HOME: "$CI_PROJECT_DIR/.m2"
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
  MAVEN_CLI_OPTS: "--batch-mode --no-transfer-progress"
  # Docker-in-Docker without TLS; Testcontainers finds the daemon through DOCKER_HOST.
  DOCKER_HOST: "tcp://docker:2375"
  DOCKER_TLS_CERTDIR: ""
  DOCKER_DRIVER: overlay2

.docker-in-docker:
  services:
    - name: docker:29-dind
      alias: docker
      command: ["--tls=false"]

# Unit tests, integration tests against PostgreSQL in Testcontainers, and the coverage gate (80 % of lines per
# module): any of them failing fails the pipeline.
verify:
  stage: test
  extends: .docker-in-docker
  image: eclipse-temurin:21-jdk
  variables:
    # Ryuk removes test containers when a run dies; this job's Docker daemon is thrown away anyway, so skip
    # pulling it.
    TESTCONTAINERS_RYUK_DISABLED: "true"
  cache:
    key: maven
    paths:
      - .m2/
  script:
    - ./mvnw $MAVEN_CLI_OPTS verify
    - bash ci/print-coverage.sh gateway-service acquirer-sim
  # The gateway's line coverage, shown on the pipeline and merge request pages.
  coverage: '/gateway-service line coverage: \d+\.\d+%/'
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - gateway-service/target/gateway-service-*.jar
      - acquirer-sim/target/acquirer-sim-*.jar
      - "*/target/site/jacoco/"
    reports:
      junit:
        - "*/target/surefire-reports/TEST-*.xml"
        - "*/target/failsafe-reports/TEST-*.xml"
      coverage_report:
        coverage_format: jacoco
        path: "*/target/site/jacoco/jacoco.xml"

# The images from the jars verify built; not pushed anywhere yet.
images:
  stage: package
  extends: .docker-in-docker
  image: docker:29-cli
  needs:
    - job: verify
      artifacts: true
  script:
    - docker build --tag "gateway-service:$CI_COMMIT_SHORT_SHA" gateway-service
    - docker build --tag "acquirer-sim:$CI_COMMIT_SHORT_SHA" acquirer-sim
