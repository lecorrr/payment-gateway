spring:
  application:
    name: risk-service
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # Well inside the gateway's deadline for an answer (300ms), so a slow Redis can't leave it without one.
      connect-timeout: 100ms
      timeout: 100ms
  grpc:
    server:
      port: ${RISK_SERVICE_PORT:9090}
    client:
      channel:
        # risk-service itself, for the made-up payment it assesses before it reports ready (WarmUp).
        self:
          target: static://localhost:${spring.grpc.server.port}

# HTTP is for the actuator only: health, and metrics for Prometheus. The payments come over gRPC.
server:
  port: ${RISK_SERVICE_HTTP_PORT:8094}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  health:
    redis:
      enabled: false   # Redis down only switches the velocity rule off, so risk-service still answers
  # Prometheus scrapes the metrics; nothing here takes them over OTLP.
  otlp:
    metrics:
      export:
        enabled: false
  # Every assessment is traced, as a child of the gateway's trace; traces are sent where
  # MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT points.
  tracing:
    sampling:
      probability: 1.0

risk:
  velocity:
    max-payments: 10
    window: 10m
  # The most one payment may be, in minor units; a currency not listed has no limit.
  amount-limits:
    UAH: 10000000   # 100 000.00 UAH
    USD: 300000     # 3 000.00 USD
    EUR: 300000     # 3 000.00 EUR
  # The first six digits of card numbers that no payment is allowed from. 400009 is the test range in the README.
  blocked-bins:
    - "400009"
