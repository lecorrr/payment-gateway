# The gateway, risk-service, the ledger, two simulated providers, a simulated shop, PostgreSQL, Redis and Kafka for a
# local demo, with Prometheus, Grafana and Jaeger watching them. Ports are published on localhost only. Build the jars
# first (./mvnw package) and make the .env file as the README shows: without it compose won't start. A host port that
# is taken can be moved in .env: GATEWAY_PORT, ACQUIRER_SIM_PORT, MONOBANK_SIM_PORT, MERCHANT_SIM_PORT, LEDGER_PORT,
# GATEWAY_DB_PORT, GRAFANA_PORT, PROMETHEUS_PORT, JAEGER_PORT.
name: payment-gateway

# Every Spring service sends its traces to Jaeger over OTLP; without this setting they would stay in the service.
x-traces: &traces
  MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT: http://jaeger:4318/v1/traces

services:
  postgres:
    image: postgres:17-alpine   # the same tag as postgres.image in pom.xml
    environment:
      POSTGRES_DB: gateway
      POSTGRES_USER: gateway
      POSTGRES_PASSWORD: gateway
    ports:
      # 5436 by default, since 5432 and the next few are often taken; the gateway run outside Docker reads
      # GATEWAY_DB_PORT too.
      - "127.0.0.1:${GATEWAY_DB_PORT:-5436}:5432"
    volumes:
      - gateway-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateway -d gateway"]
      interval: 5s
      timeout: 3s
      retries: 12

  # Open circuits shared between gateway instances, and risk-service's count of each card's payments. No port is
  # published: only the services here use it.
  redis:
    image: redis:8-alpine   # the same tag as redis.image in pom.xml

  # The payment-events topic's broker: one node that is also its own controller (KRaft, no ZooKeeper). Any KAFKA_
  # setting makes the image leave out its own defaults, so all of them are here, as in the Helm chart. No port is
  # published: only the gateway and the ledger use it.
  kafka:
    image: apache/kafka:4.2.2   # the same tag as kafka.image in pom.xml
    environment:
      # Fixed, so a restart finds its own data in the volume.
      CLUSTER_ID: 4AogIrPwRFuE_IXYvZfMDQ
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Topics are made by the apps that own them, with their partitions: a misspelt name is an error.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data/kafka-logs
      KAFKA_HEAP_OPTS: -Xms256m -Xmx256m
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      # The listener's port: Kafka's own tools would each start a JVM.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9092"]
      interval: 5s
      timeout: 3s
      retries: 24

  # The ledger's own database, which nothing else uses; no port is published.
  ledger-postgres:
    image: postgres:17-alpine   # the same tag as postgres.image in pom.xml
    environment:
      POSTGRES_DB: ledger
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ledger
    volumes:
      - ledger-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger -d ledger"]
      interval: 5s
      timeout: 3s
      retries: 12

  # Books each payment and refund that succeeded, from the gateway's events on Kafka. Its internal API, on
  # LEDGER_PORT, shows what it booked: /api/v1/payments/<id> and /api/v1/merchants/<id>/balances.
  ledger-service:
    build: ./ledger-service
    image: ledger-service:local
    depends_on:
      kafka:
        condition: service_healthy
      ledger-postgres:
        condition: service_healthy
    environment:
      <<: *traces
      DB_URL: jdbc:postgresql://ledger-postgres:5432/ledger
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "127.0.0.1:${LEDGER_PORT:-8095}:8095"

  # Asked by the gateway, over gRPC, whether a payment may go ahead. Only the gateway calls it; Prometheus reads its
  # metrics on its HTTP port, 8094.
  risk-service:
    build: ./risk-service
    image: risk-service:local
    environment:
      <<: *traces
      REDIS_HOST: redis
    depends_on:
      redis:
        condition: service_started

  acquirer-sim:
    build: ./acquirer-sim
    image: acquirer-sim:local
    environment:
      <<: *traces
      ACQUIRER_SIM_API_KEY: ${ACQUIRER_SIM_API_KEY:?make the .env file first, see the README}
      # The 3-D Secure challenge page is opened in your browser, so its link uses the published port.
      SIM_PUBLIC_URL: http://localhost:${ACQUIRER_SIM_PORT:-8091}
    ports:
      - "127.0.0.1:${ACQUIRER_SIM_PORT:-8091}:8091"

  # A second acquirer-sim, playing monobank: the gateway's monobank connector talks to the monobank-style API it
  # has under /api/merchant. Stopping it shows new payments moving to acquirer-sim.
  monobank-sim:
    build: ./acquirer-sim
    image: monobank-sim:local
    environment:
      <<: *traces
      # Its own name in traces and logs, though it is acquirer-sim inside.
      SPRING_APPLICATION_NAME: monobank-sim
      ACQUIRER_SIM_API_KEY: ${ACQUIRER_SIM_API_KEY:?make the .env file first, see the README}
      SIM_PUBLIC_URL: http://localhost:${MONOBANK_SIM_PORT:-8093}
    ports:
      - "127.0.0.1:${MONOBANK_SIM_PORT:-8093}:8091"

  merchant-sim:
    build: ./merchant-sim
    image: merchant-sim:local
    environment:
      <<: *traces
      MERCHANT_SIM_WEBHOOK_SECRET: ${GATEWAY_DEMO_MERCHANT_WEBHOOK_SECRET:?make the .env file first, see the README}
      MERCHANT_SIM_FAIL_FIRST: ${MERCHANT_SIM_FAIL_FIRST:-0}
    ports:
      - "127.0.0.1:${MERCHANT_SIM_PORT:-8092}:8092"

  gateway:
    build: ./gateway-service
    image: gateway-service:local
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      # Started with it, though the gateway doesn't wait for Kafka: its events wait in the outbox meanwhile.
      kafka:
        condition: service_started
      risk-service:
        condition: service_started
      acquirer-sim:
        condition: service_started
      monobank-sim:
        condition: service_started
      merchant-sim:
        condition: service_started
    environment:
      <<: *traces
      DB_URL: jdbc:postgresql://postgres:5432/gateway
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      RISK_SERVICE_TARGET: static://risk-service:9090
      # allow: a payment risk-service can't check goes ahead; decline: it fails.
      GATEWAY_RISK_WHEN_UNAVAILABLE: ${GATEWAY_RISK_WHEN_UNAVAILABLE:-allow}
      ACQUIRER_SIM_URL: http://acquirer-sim:8091
      ACQUIRER_SIM_API_KEY: ${ACQUIRER_SIM_API_KEY:?make the .env file first, see the README}
      GATEWAY_FINGERPRINT_KEY: ${GATEWAY_FINGERPRINT_KEY:?make the .env file first, see the README}
      GATEWAY_DEMO_MERCHANT_API_KEY: ${GATEWAY_DEMO_MERCHANT_API_KEY:?make the .env file first, see the README}
      # Webhooks go to merchant-sim inside the compose network; the browser comes back to the published port.
      GATEWAY_DEMO_MERCHANT_WEBHOOK_URL: http://merchant-sim:8092/webhooks
      GATEWAY_DEMO_MERCHANT_WEBHOOK_SECRET: ${GATEWAY_DEMO_MERCHANT_WEBHOOK_SECRET:?make the .env file first, see the README}
      GATEWAY_PUBLIC_URL: http://localhost:${GATEWAY_PORT:-8090}
      # New payments go to monobank first, and to acquirer-sim when monobank can't take them.
      GATEWAY_PROVIDERS: ${GATEWAY_PROVIDERS:-monobank,acquirer-sim}
      # monobank is monobank-sim, with acquirer-sim's key as the token, unless .env names the real one and a token
      # (see .env.example). monobank-sim sends its webhooks here; the real monobank needs a public address of this
      # gateway in GATEWAY_MONOBANK_WEBHOOK_URL, or the setting left empty for none, which the single "-" allows.
      MONOBANK_URL: ${MONOBANK_URL:-http://monobank-sim:8091}
      GATEWAY_MONOBANK_TOKEN: ${GATEWAY_MONOBANK_TOKEN:-${ACQUIRER_SIM_API_KEY}}
      GATEWAY_MONOBANK_WEBHOOK_URL: ${GATEWAY_MONOBANK_WEBHOOK_URL-http://gateway:8090/providers/monobank/webhooks}
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8090}:8090"

  # Traces from every service, kept in memory: a restart empties it. Its UI is on JAEGER_PORT; OTLP (4318) is only
  # for the services here.
  jaeger:
    image: jaegertracing/jaeger:2.23.0
    ports:
      - "127.0.0.1:${JAEGER_PORT:-16686}:16686"

  # Scrapes /actuator/prometheus of every service every 5 seconds (observability/prometheus/prometheus.yml).
  prometheus:
    image: prom/prometheus:v3.16.0
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"

  # Opens on the payment-gateway dashboard, with Prometheus as its data source; anyone may look without logging in.
  # To change it, log in as admin (password admin at first) and save a copy: the provisioned one is read-only.
  grafana:
    image: grafana/grafana:13.3.0
    depends_on:
      prometheus:
        condition: service_started
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/payment-gateway.json
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"

volumes:
  gateway-db:
  ledger-db:
  kafka-data:
